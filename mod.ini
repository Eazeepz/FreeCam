[mod]
name = Free Camera
author = hermes
version = 1.6
description = Press Insert to detach the camera from the player and fly it around. Hold right mouse and use WASD to fly, Q/E for down/up, Shift for faster, Control for slower, and move the mouse to look. F2 freezes the world with the camera still free, so you can line up a shot and hold it; switching the camera off hands it back to your character and resumes the world. The controls are listed on screen while it is active.

[settings]
; Key that turns the free camera on and off. The loader accepts F1-F24,
; NUMPAD0-9, INSERT, DELETE, HOME, END, PAGEUP, PAGEDOWN, SPACE, TAB, ESC,
; ENTER and the modifiers. CAPS is handled on top of that list, because the
; loader has no name for Caps Lock.
;
; CAPS also works, and is handled on top of the list above, but it cannot be a
; key you leave switched on. Caps Lock is a toggle, yet GetAsyncKeyState reports
; its PHYSICAL state here, so key_down reads it as momentary: hold Caps and the
; camera is on, let go and it goes straight back to the player. The loader
; exposes no way to read the toggle bit instead (there is no API for it), so use
; INSERT unless you specifically want hold-to-peek.
key = INSERT
; The same key does all three states. Press it and the camera detaches and
; you can fly it with WASD; press it again and the camera freezes exactly where
; it stands; press it a third time and the camera goes back to the player.
;
; Note that aiming is camera-relative in this game, so a locked camera is also a
; fixed firing line: the player shoots where the frozen view points, not where
; the character faces.
; Freeze the world with the camera still free, so you can line up a shot and
; hold it. Only works while the free camera is on, and turning the camera off
; always thaws the world, so this can never leave you stuck in a frozen game.
; F2 is unclaimed: the port takes F1, F3, F4, F7, F10 and F11, HUD Toggle has
; F12. It reproduces the guest-memory half of World Studio's pause (time
; divisor, fixed-step flag and rate, and the cutscene clock). Audio is not
; paused and the host clock is not slowed -- neither is reachable from Lua -- so
; music keeps playing and anything driven by mftb rather than game time creeps.
pause_key = F2
; Metres per second. The game is built for a car, so 8 is a brisk walk.
speed = 8.0
; Multipliers applied while Shift (faster) or Control (slower) is held.
fast_multiplier = 4.0
slow_multiplier = 0.25
; Scales the mouse. 1.0 turns the view by exactly the movement of the mouse.
look_speed = 1.0
; Flip vertical look on top of the game's own setting. The game's Controls
; options already apply "invert Y" to the camera, and wml.mouse_look() carries
; that same flip, so leave this false to match the player camera and set it
; true if you want the free camera the other way round.
invert_y = true
; Show the controls in the corner while the free camera is on. The list is
; built from the settings above, so it stays true if you change them.
;
; Drawing needs the native half: main.lua writes the list to help.txt in this
; folder and FreeCamHelp.dll displays it. There is no text call for Lua -- the
; loader does not register overlay_text -- so without the DLL the camera works
; but nothing is drawn. Rebuild the DLL after changing this file's key name if
; the help ever shows the wrong key:
;   bash modding/mods/FreeCam/build_and_check.sh
; Also a hotkey, so the list can be hidden and brought back without editing this
; file. help_key is that key.
help_key = F7
show_help = true
; How far up and down the view may tilt, in degrees. 86 stops just short of
; straight up or down, where the basis would flip.
pitch_limit = 86.0